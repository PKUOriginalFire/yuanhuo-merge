# 合成大元火 —— nginx 站点
#
# 目标服务器：Ubuntu 22.04 / nginx 1.18.0
#
# ⚠️ nginx 1.18 **不支持** `http2 on;` 这种写法（1.25.1 才引入），
#    必须写成 `listen 443 ssl http2;`。本文件已按 1.18 的语法写。
#    证书部分原本由 certbot 自动补上，这里已经手动写好 ——
#    用 certbot --nginx 再跑一次也没问题（它会识别并保留）。
#
# ⚠️ add_header 在 nginx 里是**覆盖**语义：只要某个 location 里出现了任何
#    add_header，该 location 就完全不再继承 server 级的 add_header。
#    所以凡是用到 add_header 的 location 都必须自己 include 一次安全头
#    （见 deploy/nginx-security-headers.conf）。

# ── 80 端口：只做 ACME 验证和跳转，不提供任何内容
server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;

    # 不暴露 nginx 版本号
    server_tokens off;

    # certbot 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443 端口：正式服务
server {
    # nginx 1.18 只能用这种写法，不能写 `http2 on;`
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.example.com;

    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 不暴露 nginx 版本号
    server_tokens off;

    # ── 抗 DoS（2026-10-19 加）
    # zone 定义见 /etc/nginx/conf.d/yuanhuo-rate-limit.conf
    #
    # 背景：后端是单线程 Node，一次最坏 checkpoint 要 ~20ms CPU，
    # 单 IP 就能把事件循环占满。所以在**边缘**先把每个 IP 的速率卡住。
    # 应用层限流仍然保留（防御纵深），但它是内存表、按 worker 各一份，
    # 真正的第一道闸在这里。
    limit_conn yh_conn 10;          # 每 IP 最多 10 条并发连接，防 slowloris
    limit_conn_status 429;
    limit_req_status 429;           # 触发限流返回 429 而不是 nginx 默认的 503
    # slowloris 的另一半：连接上不传数据就别一直占着。默认 60s 太宽松。
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # server 级安全头 —— 覆盖那些自己没有 add_header 的 location
    # （/api/、/api/admin/、/.well-known/ 等）
    include /etc/nginx/snippets/yuanhuo-security.conf;

    # 静态站
    root /opt/yuanhuo/web/dist;
    index index.html;

    # gzip：JS 从 131KB 压到 43KB
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # SPA 回退
    location / {
        include /etc/nginx/snippets/yuanhuo-security.conf;
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物 → 永久缓存
    # 只用 add_header，不要同时写 expires —— 两者都会发 Cache-Control，会重复两个头
    # ⚠️ 每个用了 add_header 的 location 都必须再 include 一次安全头，
    #    否则会覆盖掉 server 级的（nginx 的 add_header 是覆盖而非叠加）
    location /assets/ {
        include /etc/nginx/snippets/yuanhuo-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 美术图 / 音频 → 长缓存
    location ~* \.(png|jpg|jpeg|webp|gif|svg|ico|mp3|ogg|wav|woff2)$ {
        include /etc/nginx/snippets/yuanhuo-security.conf;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # index.html 绝不缓存，否则发版后用户拿到旧的
    location = /index.html {
        include /etc/nginx/snippets/yuanhuo-security.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── 后端 API
    location /api/ {
        # 通用限流：每 IP 10r/s，突发 20
        limit_req zone=yh_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # ⚠️ 后端**只认** X-Real-IP 来取客户端 IP（限流 + ip_hash 都靠它）。
        #    它由 $remote_addr 生成，客户端改不了。
        #    绝对不能让后端去读 X-Forwarded-For 的最左值 —— 那一段是客户端
        #    自己发的，等于把限流开关交给攻击者（上线后实测确认过的漏洞）。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 和后端的 MAX_BODY（1MB）保持一致；后端还会再把 state 卡在 320KB。
        # 之前是 2m：攻击者可以让服务器先 JSON.parse 一个 2MB 的包（~7ms CPU）再拒掉。
        client_max_body_size 1m;
    }

    # ── 开局：比存档贵（要写库 + 插一行），单独更严的限流
    location = /api/run/start {
        limit_req zone=yh_start burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        client_max_body_size 64k;
    }

    # ── 提交成绩：正常人一局只交一次，单独卡到 6r/m
    #
    # ⚠️ client_max_body_size 必须和 /api/ 一样给到 1m，不能压到 64k。
    #    提交包里带**完整 trace**（每次投放一条 {t,x,lv}，约 32 字节），
    #    所以它是随对局长度线性增长的 —— 实测 2553 次投放 = 79KB、3228 次 = 98KB。
    #    2026-10-19 这里写了 64k，导致**分最高的那批长局全部提交失败**：
    #    玩家「玩家F」打了 2.4 小时的无尽局 13527 分（本可上到第 2 名），提交时
    #    nginx 直接 413，成绩丢失（日志里 4 次 413 全来自他）。
    #    trace 上限 20000 条 ≈ 640KB，1m 有 1.6 倍余量。
    location = /api/run/submit {
        limit_req zone=yh_submit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        client_max_body_size 1m;
    }

    # ── 排行榜：读多写少，给一点点缓存挡住刷接口的
    location = /api/leaderboard {
        include /etc/nginx/snippets/yuanhuo-security.conf;
        limit_req zone=yh_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "public, max-age=15";
    }

    # 后台接口：只允许本机访问（要看的话走 SSH 隧道）
    location /api/admin/ {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
